<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jake Reichenauer: Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css">
</head>
<body>
  <div id="canvas">
    <aside class="sidebar">
      <h1 class="desktop-header">JAKE<br>REICHENAUER</h1>
      <div class="mobile-header">
        <h1 class="mobile-title">JAKE REICHENAUER</h1>
        <button class="menu-toggle" onclick="toggleMenu()">Menu</button>
      </div>
      <div class="nav-wrapper">
        <nav class="desktop-menu">
          <ul>
            <li><a href="index.html">Portfolio</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="https://instagram.com/jaketakesfotos" target="_blank">@jaketakesfotos</a></li>
          </ul>
        </nav>
        <nav id="mobile-menu" class="hidden mobile-only">
          <ul>
            <li><a href="index.html">Portfolio</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="https://instagram.com/jaketakesfotos" target="_blank">@jaketakesfotos</a></li>
          </ul>
        </nav>
      </div>
    </aside>

    <main class="main-content">
      <div class="view-toggle">
        <button id="toggle-view" onclick="toggleView()">Switch to Mosaic View</button>
      </div>
      <div id="single-view" class="image-area">
        <div class="click-zone left" onclick="prevImage()"><span class="arrow-icon">&#10094;</span></div>
        <div class="image-wrapper">
          <img id="gallery-image" src="images/model-tests/P1.jpg" alt="Portfolio Image" />
        </div>
        <div class="click-zone right" onclick="nextImage()"><span class="arrow-icon">&#10095;</span></div>
        <div class="side-arrow left" onclick="prevImage()">&#10094;</div>
        <div class="side-arrow right" onclick="nextImage()">&#10095;</div>
      </div>
      <section id="mosaic-view" class="gallery hidden">
        <!-- JavaScript will populate this -->
      </section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox.min.js"></script>
  <script src="gallery.js"></script>
  <script>
    function toggleMenu() {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
    }
  </script>
</body>
</html>
